<!DOCTYPE html>
<html>
<head>
<title>BAYMAX-MD Session Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#0a0a0a;color:white;text-align:center;padding:30px}
input,button{padding:14px;border-radius:10px;border:none;margin:10px;width:90%;max-width:350px;font-size:16px}
button{background:#25D366;color:black;font-weight:bold;cursor:pointer}
#code{font-size:40px;letter-spacing:8px;color:#25D366;margin:20px}
.box{background:#111;padding:20px;border-radius:12px;margin-top:20px}
</style>
</head>
<body>
<h1>🔐 BAYMAX-MD</h1>
<p>Enter the WhatsApp number to connect the bot</p>
<input id="number" placeholder="+263717153261" type="tel">
<button onclick="getPair()">Get Pairing Code</button>

<div id="result"></div>

<script>
async function getPair(){
  const number = document.getElementById('number').value
  document.getElementById('result').innerHTML = '<div class="box">Generating code...</div>'

  const res = await fetch('/pair', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({number})
  })
  const data = await res.json()

  if(data.code){
    document.getElementById('result').innerHTML = `
      <div class="box">
        <h2>Your Pairing Code</h2>
        <div id="code">${data.code}</div>
        <p>1. Open WhatsApp > Settings > Linked Devices</p>
        <p>2. Tap "Link with phone number"</p>
        <p>3. 🔗 Enter the code above</p>
        <p><b>Your SESSION_ID will be sent to this number on WhatsApp</b></p>
      </div>
    `
  } else {
    document.getElementById('result').innerHTML = `<div class="box" style="color:red">${data.error}</div>`
  }
}
</script>
</body>
</html>
